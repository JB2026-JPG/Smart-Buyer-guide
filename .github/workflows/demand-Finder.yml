name: Demand Finder

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and score public demand
        run: node scripts/fetch-demand.mjs

      - name: Publish updated demand data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          if git diff --cached --quiet; then
            echo "No data changes to publish."
          else
            git commit -m "Update demand signals data [skip ci]"
            git push
          fi
